[workspace]
resolver = "2"
members = [
    "core",
    "connectors/binance",
    "sdk",
    "cli",
]

[workspace.package]
edition = "2021"
authors = ["EK3-Qinxuan <maintainer@example.com>"]
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
url = "2"
